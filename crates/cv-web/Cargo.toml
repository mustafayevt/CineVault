[package]
name = "cv-web"
description = "CineVault browser server: the library and its commands over HTTP."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "cinevault-server"
path = "src/main.rs"

[dependencies]
cv-app.workspace = true
cv-artwork.workspace = true
cv-db.workspace = true
cv-domain.workspace = true
cv-fs.workspace = true
cv-ipc.workspace = true
cv-jobs.workspace = true
axum.workspace = true
argon2.workspace = true
rand_core.workspace = true
subtle = "2"
if-addrs = "0.13"
rpassword = "7"
ipnet.workspace = true
percent-encoding = "2"
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-stream = "0.1"
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
