[package]
name = "cinevault-cli"
description = "The `cinevault` command-line interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "cinevault_cli"
path = "src/lib.rs"

[[bin]]
name = "cinevault"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
cv-app.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
cv-db.workspace = true
cv-domain.workspace = true
cv-providers.workspace = true
tempfile.workspace = true

[lints]
workspace = true
