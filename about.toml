# cargo-about configuration: licences allowed in the shipped Rust dependency tree.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "0BSD",
    "OpenSSL",
    "bzip2-1.0.6",
    "CDLA-Permissive-2.0",
]
# The platform targets CineVault ships on.
targets = ["x86_64-pc-windows-msvc", "aarch64-apple-darwin", "x86_64-apple-darwin"]
# Workspace crates are not published and carry no third-party licence.
private = { ignore = true }
ignore-build-dependencies = true
ignore-dev-dependencies = true
